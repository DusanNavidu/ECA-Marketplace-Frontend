name: Deploy Frontend to GCP Cloud Run

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Google Cloud Auth
        uses: google-github-actions/auth@v1
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Build and Push Docker Image
        run: |
          gcloud auth configure-docker
          docker build -t gcr.io/eca-marketplace-506520/frontend:latest .
          docker push gcr.io/eca-marketplace-506520/frontend:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy eca-frontend \
            --image gcr.io/eca-marketplace-506520/frontend:latest \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --port 80